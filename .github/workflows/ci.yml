name: ci

on:
    push:
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [20, 22, 24]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            # lint, formatting, the tests (architecture, i18n included) and the type declarations
            - run: npm run check
            # the golden record of analysis and explanations, made on Node 24 (the Intl output of other versions may differ)
            - if: matrix.node == 24
              run: npm run snapshot:verify
